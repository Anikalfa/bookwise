<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecBook — বাংলা বইয়ের সেরা সঙ্গী</title>

  <!--
  ╔════════════════════════════════════════════════════════════════╗
  ║  RecBook — Production Design System v2                         ║
  ║                                                                ║
  ║  Philosophy: Stripe × Notion × Goodreads                       ║
  ║  Font:       Inter (single typeface, 300–800 weights)          ║
  ║  Spacing:    8px base grid (4, 8, 12, 16, 24, 32, 48, 64)      ║
  ║  Colors:     1 brand teal + neutral slate scale only           ║
  ║  Rules:      No bright gradients · no rainbow · max clarity    ║
  ╚════════════════════════════════════════════════════════════════╝
-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 1. COLOR SYSTEM ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   One brand color. One neutral scale. Everything else is white.
   Inspired by Stripe's disciplined palette.
   ═══════════════════════════════════════════════════════════════════ */
    :root {
      /* ─ Brand: Single teal ──────────────────────────────────────── */
      --brand: #0d9488;
      /* Primary interactive elements      */
      --brand-h: #0f766e;
      /* Hover state                       */
      --brand-deep: #115e59;
      /* Active / pressed                  */
      --brand-subtle: #f0fdfa;
      /* Tinted background surfaces        */
      --brand-muted: #ccfbf1;
      /* Tinted borders                    */
      --brand-text: #0d4f47;
      /* Brand-tinted text                 */

      /* ─ Neutral / Slate scale ──────────────────────────────────── */
      --gray-900: #0f172a;
      /* Near-black: headings                  */
      --gray-800: #1e293b;
      /* Dark: body emphasis                   */
      --gray-700: #334155;
      /* Medium dark: primary body             */
      --gray-600: #475569;
      /* Medium: secondary body                */
      --gray-500: #64748b;
      /* Mid: captions, labels                 */
      --gray-400: #94a3b8;
      /* Light-mid: placeholders               */
      --gray-300: #cbd5e1;
      /* Light: borders                        */
      --gray-200: #e2e8f0;
      /* Lighter: dividers                     */
      --gray-150: #edf0f4;
      /* Near-white: card borders              */
      --gray-100: #f1f5f9;
      /* Subtle backgrounds                    */
      --gray-50: #f8fafc;
      /* Page background                       */

      /* ─ Semantic mappings ─────────────────────────────────────── */
      --text-primary: var(--gray-900);
      --text-secondary: var(--gray-600);
      --text-muted: var(--gray-400);
      --text-brand: var(--brand);

      --surface: #ffffff;
      --surface-2: var(--gray-100);
      --bg: var(--gray-50);
      --border: var(--gray-200);
      --border-soft: var(--gray-150);

      /* ─ Status ─────────────────────────────────────────────────── */
      --amber: #f59e0b;
      --amber-bg: #fffbeb;
      --red: #ef4444;
      --red-bg: #fef2f2;
      --green: #10b981;
      --green-bg: #f0fdf4;

      /* ─ Typography ─────────────────────────────────────────────── */
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-bn: 'Hind Siliguri', 'Inter', sans-serif;

      /* ─ 8px spacing scale ──────────────────────────────────────── */
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 20px;
      --sp-6: 24px;
      --sp-8: 32px;
      --sp-10: 40px;
      --sp-12: 48px;
      --sp-16: 64px;

      /* ─ Radius ─────────────────────────────────────────────────── */
      --r-sm: 6px;
      --r-md: 10px;
      --r-lg: 14px;
      --r-xl: 18px;
      --r-2xl: 24px;
      --r-pill: 9999px;

      /* ─ Shadow scale (Stripe-style) ────────────────────────────── */
      --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, .05);
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, .08), 0 1px 2px -1px rgba(0, 0, 0, .06);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, .07), 0 2px 4px -2px rgba(0, 0, 0, .05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, .08), 0 4px 6px -4px rgba(0, 0, 0, .05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, .08), 0 8px 10px -6px rgba(0, 0, 0, .04);
      --shadow-card-hover: 0 12px 24px -4px rgba(0, 0, 0, .10), 0 4px 8px -2px rgba(0, 0, 0, .06);

      /* ─ Motion ─────────────────────────────────────────────────── */
      --ease: cubic-bezier(.4, 0, .2, 1);
      --ease-out: cubic-bezier(0, 0, .2, 1);
      --t-fast: 120ms;
      --t-std: 180ms;
      --t-slow: 300ms;
    }

    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 2. RESET & BASE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ═══════════════════════════════════════════════════════════════════ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-bn);
      /* Bengali default              */
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* English mode: switch to Inter */
    body.en {
      font-family: var(--font-sans);
    }

    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 3. AUTH SCREEN ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   Minimal, centered card. No gradients — just depth and clarity.
   ═══════════════════════════════════════════════════════════════════ */
    #auth-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--sp-6);
      /* Subtle page texture instead of loud gradient */
      background: var(--bg);
      background-image:
        radial-gradient(circle at 25% 10%, rgba(13, 148, 136, .06) 0%, transparent 50%),
        radial-gradient(circle at 75% 90%, rgba(13, 148, 136, .04) 0%, transparent 50%);
    }

    .auth-card {
      background: var(--surface);
      border-radius: var(--r-xl);
      padding: var(--sp-10) var(--sp-8) var(--sp-8);
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--border-soft);
      /* Hairline top accent */
      border-top: 3px solid var(--brand);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: var(--sp-8);
    }

    .auth-icon {
      width: 56px;
      height: 56px;
      background: var(--brand-subtle);
      border: 1.5px solid var(--brand-muted);
      border-radius: var(--r-lg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin-bottom: var(--sp-3);
    }

    .auth-logo h1 {
      font-family: var(--font-sans);
      font-size: 1.625rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -.03em;
      line-height: 1;
    }

    .auth-logo p {
      font-size: .875rem;
      color: var(--text-secondary);
      margin-top: var(--sp-1);
      font-weight: 400;
    }

    /* Language pill */
    .auth-lang {
      display: flex;
      justify-content: center;
      margin-bottom: var(--sp-5);
    }

    .lang-pill {
      display: flex;
      background: var(--gray-100);
      border-radius: var(--r-pill);
      padding: 3px;
      gap: 2px;
      border: 1px solid var(--border);
    }

    .lp-btn {
      padding: var(--sp-1) var(--sp-4);
      border: none;
      border-radius: var(--r-pill);
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--t-std) var(--ease);
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
    }

    .lp-btn.on {
      background: var(--surface);
      color: var(--brand);
      box-shadow: var(--shadow-xs);
    }

    /* Auth tabs */
    .auth-tabs {
      display: flex;
      background: var(--gray-100);
      border-radius: var(--r-md);
      padding: 3px;
      margin-bottom: var(--sp-6);
      gap: 2px;
      border: 1px solid var(--border);
    }

    .a-tab {
      flex: 1;
      padding: .55rem var(--sp-2);
      border: none;
      background: transparent;
      border-radius: calc(var(--r-md) - 2px);
      font-size: .86rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--t-std) var(--ease);
      font-family: inherit;
    }

    .a-tab.on {
      background: var(--surface);
      color: var(--brand);
      box-shadow: var(--shadow-xs);
      font-weight: 700;
    }

    /* Form fields */
    .field {
      margin-bottom: var(--sp-4);
    }

    .field label {
      display: block;
      font-family: var(--font-sans);
      font-size: .72rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: var(--sp-2);
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      padding: .6875rem var(--sp-3);
      border: 1.5px solid var(--border);
      border-radius: var(--r-md);
      font-size: .9rem;
      background: var(--surface);
      outline: none;
      transition: all var(--t-std) var(--ease);
      font-family: inherit;
      color: var(--text-primary);
    }

    .field input::placeholder {
      color: var(--text-muted);
    }

    .field input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, .12);
    }

    /* Primary button */
    .btn-auth {
      width: 100%;
      padding: .75rem;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: var(--r-md);
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: var(--sp-2);
      transition: all var(--t-std) var(--ease);
      font-family: var(--font-sans);
      letter-spacing: -.01em;
    }

    .btn-auth:hover {
      background: var(--brand-h);
      box-shadow: 0 4px 12px rgba(13, 148, 136, .3);
      transform: translateY(-1px);
    }

    .btn-auth:active {
      transform: none;
    }

    /* Error state */
    .auth-err {
      background: var(--red-bg);
      border: 1px solid #fecaca;
      border-radius: var(--r-sm);
      padding: .5rem var(--sp-3);
      color: var(--red);
      font-size: .82rem;
      margin-top: var(--sp-3);
      display: none;
    }

    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 4. APP SHELL ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ═══════════════════════════════════════════════════════════════════ */
    #app {
      display: none;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 5. TOPBAR ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   Pure white. 64px tall. Single bottom shadow line. Amazon-grade.
   ═══════════════════════════════════════════════════════════════════ */
    .topbar {
      background: var(--surface);
      padding: 0 var(--sp-8);
      height: 64px;
      display: flex;
      align-items: center;
      gap: var(--sp-5);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 0 var(--border), 0 2px 8px rgba(0, 0, 0, .04);
      position: sticky;
      top: 0;
      z-index: 500;
    }

    /* Logo */
    .tlogo {
      font-family: var(--font-sans);
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: -.03em;
      text-decoration: none;
      flex-shrink: 0;
      transition: opacity var(--t-fast);
    }

    .tlogo:hover {
      opacity: .75;
    }

    /* Search */
    .tsearch {
      flex: 1;
      max-width: 520px;
      position: relative;
    }

    .tsearch input {
      width: 100%;
      padding: .5625rem var(--sp-4) .5625rem 2.5rem;
      border: 1.5px solid var(--border);
      border-radius: var(--r-pill);
      background: var(--gray-100);
      color: var(--text-primary);
      font-size: .875rem;
      outline: none;
      transition: all var(--t-std) var(--ease);
      font-family: inherit;
    }

    .tsearch input::placeholder {
      color: var(--text-muted);
    }

    .tsearch input:focus {
      border-color: var(--brand);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, .10);
    }

    .tsearch-ico {
      position: absolute;
      left: .875rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: .875rem;
      line-height: 1;
      transition: color var(--t-fast);
    }

    .tsearch:focus-within .tsearch-ico {
      color: var(--brand);
    }

    /* Right controls */
    .tright {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      margin-left: auto;
      flex-shrink: 0;
    }

    /* Language toggle — same as auth pill but smaller */
    .lang-pill-app {
      display: flex;
      background: var(--gray-100);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      padding: 3px;
      gap: 2px;
    }

    .lpa-btn {
      padding: .25rem .6rem;
      border: none;
      border-radius: var(--r-pill);
      font-size: .72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--t-std) var(--ease);
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-sans);
    }

    .lpa-btn.on {
      background: var(--brand);
      color: #fff;
      box-shadow: var(--shadow-xs);
    }

    /* Avatar */
    .tuser {
      width: 34px;
      height: 34px;
      border-radius: var(--r-pill);
      background: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: .8rem;
      cursor: pointer;
      transition: all var(--t-std) var(--ease);
      flex-shrink: 0;
      border: 2px solid transparent;
      letter-spacing: .02em;
    }

    .tuser:hover {
      opacity: .85;
      border-color: var(--brand-muted);
    }

    /* Sign out */
    .tsignout {
      padding: .4rem var(--sp-3);
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      background: transparent;
      font-size: .8rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--t-std) var(--ease);
      white-space: nowrap;
      font-family: var(--font-sans);
    }

    .tsignout:hover {
      border-color: var(--red);
      color: var(--red);
      background: var(--red-bg);
    }

    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 6. SEARCH DROPDOWN ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ═══════════════════════════════════════════════════════════════════ */
    .search-dropdown {
      position: absolute;
      top: calc(100% + var(--sp-2));
      left: 0;
      right: 0;
      background: var(--surface);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-xl);
      z-index: 9999;
      display: none;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .search-dropdown.open {
      display: block;
      animation: popIn var(--t-std) var(--ease-out);
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(-6px) scale(.98);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .sd-section {
      padding: var(--sp-4) var(--sp-4) var(--sp-3);
    }

    .sd-label {
      font-family: var(--font-sans);
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-muted);
      margin-bottom: var(--sp-3);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }

    .sd-chips {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-2);
      margin-bottom: var(--sp-1);
    }

    .sd-chip {
      padding: .3rem .75rem;
      border-radius: var(--r-pill);
      font-size: .78rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      background: var(--surface);
      transition: all var(--t-fast) var(--ease);
      white-space: nowrap;
      font-family: inherit;
    }

    .sd-chip:hover {
      border-color: var(--brand);
      color: var(--brand);
      background: var(--brand-subtle);
    }

    .sd-chip.bn {
      font-family: var(--font-bn);
    }

    .sd-divider {
      height: 1px;
      background: var(--border);
      margin: 0;
    }

    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 7. FILTER PANEL ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ═══════════════════════════════════════════════════════════════════ */
    .filter-toggle {
      position: fixed;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      background: var(--gray-800);
      color: rgba(255, 255, 255, .9);
      border: none;
      cursor: pointer;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      padding: var(--sp-4) var(--sp-3);
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .08em;
      z-index: 600;
      display: none;
      align-items: center;
      gap: var(--sp-2);
      transition: background var(--t-fast);
      font-family: var(--font-sans);
      box-shadow: var(--shadow-md);
    }

    .filter-toggle.show {
      display: flex;
    }

    .filter-toggle:hover {
      background: var(--brand);
    }

    .filter-toggle .ft-ico {
      font-size: .875rem;
      writing-mode: initial;
    }

    .filter-badge {
      background: var(--amber);
      color: #fff;
      border-radius: var(--r-pill);
      width: 16px;
      height: 16px;
      font-size: .6rem;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
      writing-mode: initial;
    }

    .filter-badge.show {
      display: flex;
    }

    .filter-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .32);
      z-index: 700;
      display: none;
      backdrop-filter: blur(2px);
    }

    .filter-overlay.open {
      display: block;
    }

    .filter-panel {
      position: fixed;
      left: 0;
      top: 0;
      height: 100%;
      width: 272px;
      background: var(--surface);
      z-index: 800;
      box-shadow: var(--shadow-xl);
      transform: translateX(-100%);
      transition: transform var(--t-slow) var(--ease);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .filter-panel.open {
      transform: none;
    }

    .fp-hd {
      background: var(--gray-900);
      padding: var(--sp-5) var(--sp-5) var(--sp-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .fp-title {
      font-family: var(--font-sans);
      color: #fff;
      font-size: .9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }

    .fp-close {
      width: 28px;
      height: 28px;
      border-radius: var(--r-pill);
      border: 1px solid rgba(255, 255, 255, .2);
      background: transparent;
      color: rgba(255, 255, 255, .7);
      font-size: .9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--t-fast);
      line-height: 1;
    }

    .fp-close:hover {
      background: rgba(255, 255, 255, .12);
      color: #fff;
    }

    .fp-body {
      flex: 1;
      overflow-y: auto;
      padding: var(--sp-5) var(--sp-4) var(--sp-6);
    }

    .fp-section {
      margin-bottom: var(--sp-6);
    }

    .fp-section-label {
      font-family: var(--font-sans);
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .10em;
      color: var(--text-muted);
      margin-bottom: var(--sp-3);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }

    .fp-options {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }

    .fp-opt {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: .5rem var(--sp-3);
      border-radius: var(--r-md);
      border: 1.5px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      transition: all var(--t-fast) var(--ease);
      font-size: .84rem;
      font-weight: 500;
      color: var(--text-secondary);
      font-family: inherit;
      text-align: left;
      width: 100%;
    }

    .fp-opt:hover {
      border-color: var(--brand);
      color: var(--brand);
      background: var(--brand-subtle);
    }

    .fp-opt.on {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
      font-weight: 600;
    }

    .fp-opt-ico {
      font-size: .875rem;
      flex-shrink: 0;
    }

    .fp-divider {
      height: 1px;
      background: var(--border);
      margin: var(--sp-3) 0 var(--sp-5);
    }

    .fp-foot {
      padding: var(--sp-4);
      border-top: 1px solid var(--border);
      display: flex;
      gap: var(--sp-2);
      background: var(--gray-50);
    }

    .fp-apply {
      flex: 1;
      padding: .5625rem;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: var(--r-md);
      font-size: .84rem;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: background var(--t-fast);
    }

    .fp-apply:hover {
      background: var(--brand-h);
    }

    .fp-reset {
      padding: .5625rem var(--sp-4);
      border: 1.5px solid var(--border);
      border-radius: var(--r-md);
      background: transparent;
      font-size: .82rem;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      transition: all var(--t-fast);
    }

    .fp-reset:hover {
      border-color: var(--red);
      color: var(--red);
      background: var(--red-bg);
    }

    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 8. NAVBAR ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   White background. Clean. Brand-teal underline on active/hover.
   This is the key change from v1 — white replaces dark navy.
   ═══════════════════════════════════════════════════════════════════ */
    .navbar {
      background: var(--surface);
      z-index: 400;
      border-bottom: 1px solid var(--border);
      box-shadow: none;
      /* Stripe-style: no shadow on secondary nav */
    }

    .nav-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 var(--sp-8);
      display: flex;
      align-items: center;
    }

    .nav-item {
      position: relative;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: var(--sp-1);
      padding: var(--sp-3) var(--sp-4);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: .875rem;
      font-weight: 500;
      cursor: pointer;
      transition: color var(--t-fast) var(--ease);
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      /* sit on the border */
      font-family: inherit;
      line-height: 1;
      height: 44px;
    }

    .nav-btn:hover {
      color: var(--text-primary);
      border-bottom-color: var(--gray-300);
    }

    .nav-btn.open,
    .nav-btn:focus-visible {
      color: var(--brand);
      border-bottom-color: var(--brand);
    }

    .nav-caret {
      font-size: .55rem;
      color: var(--text-muted);
      transition: transform var(--t-std) var(--ease);
      margin-left: 2px;
    }

    .nav-btn.open .nav-caret {
      transform: rotate(180deg);
      color: var(--brand);
    }

    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 9. DROPDOWN MENUS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   Clean white sheet. Notion-style hover highlights.
   ═══════════════════════════════════════════════════════════════════ */
    .dd {
      position: absolute;
      top: calc(100% + var(--sp-2));
      left: 0;
      background: var(--surface);
      min-width: 700px;
      max-width: 940px;
      z-index: 9999;
      display: none;
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .dd.open {
      display: block;
      animation: popIn var(--t-std) var(--ease-out);
    }

    /* No coloured accent strip — Notion doesn't use them */
    .dd-body {
      padding: var(--sp-3) var(--sp-3) var(--sp-2);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
    }

    .dd-item {
      padding: .4375rem var(--sp-3);
      border-radius: var(--r-sm);
      font-size: .83rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--t-fast) var(--ease);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 400;
      font-family: var(--font-bn);
    }

    .dd-item:hover {
      background: var(--gray-100);
      color: var(--text-primary);
      font-weight: 500;
    }

    .dd-foot {
      padding: var(--sp-2) var(--sp-3) var(--sp-3);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      background: var(--gray-50);
    }

    .dd-more {
      font-family: var(--font-sans);
      color: var(--brand);
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: none;
      padding: .25rem var(--sp-2);
      border-radius: var(--r-sm);
      transition: background var(--t-fast);
    }

    .dd-more:hover {
      background: var(--brand-subtle);
    }

    .dd-msg {
      padding: var(--sp-6);
      text-align: center;
      color: var(--text-muted);
      font-size: .82rem;
      grid-column: 1/-1;
    }

    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 10. MAIN CONTENT ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ═══════════════════════════════════════════════════════════════════ */
    .main {
      max-width: 1400px;
      margin: 0 auto;
      padding: var(--sp-8) var(--sp-8) var(--sp-16);
    }

    /* ─ Section header ─────────────────────────────────────────── */
    .sec-hd {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: var(--sp-6);
      padding-bottom: var(--sp-5);
      border-bottom: 1px solid var(--border);
    }

    .sec-ttl {
      font-family: var(--font-sans);
      font-size: 1.1875rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -.02em;
      line-height: 1.25;
    }

    .sec-ttl em {
      color: var(--brand);
      font-style: normal;
    }

    .sec-sub {
      font-size: .8125rem;
      color: var(--text-secondary);
      margin-top: var(--sp-1);
      font-weight: 400;
    }

    /* ─ Badges ────────────────────────────────────────────────── */
    .sbadge {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .25rem .625rem;
      border-radius: var(--r-pill);
      font-family: var(--font-sans);
      font-size: .71rem;
      font-weight: 600;
      letter-spacing: .01em;
    }

    .sbadge.cold {
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
    }

    .sbadge.warm {
      background: var(--green-bg);
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .sbadge.browse {
      background: var(--brand-subtle);
      color: var(--brand-text);
      border: 1px solid var(--brand-muted);
    }

    /* ─ Reason strip ─────────────────────────────────────────── */
    .reason-strip {
      background: var(--brand-subtle);
      border-left: 3px solid var(--brand);
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
      padding: .625rem var(--sp-4);
      margin-bottom: var(--sp-5);
    }

    .reason-txt {
      font-size: .8125rem;
      color: var(--brand-text);
      font-weight: 600;
      margin-bottom: var(--sp-2);
    }

    .cat-chips {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-2);
    }

    .cat-chip {
      background: var(--brand);
      color: #fff;
      padding: .25rem .625rem;
      border-radius: var(--r-pill);
      font-family: var(--font-sans);
      font-size: .72rem;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--t-fast) var(--ease);
    }

    .cat-chip:hover {
      background: var(--brand-h);
    }

    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 11. CAROUSEL ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ═══════════════════════════════════════════════════════════════════ */
    .carousel-section {
      margin-bottom: var(--sp-12);
    }

    .car-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: var(--sp-6);
      padding-bottom: var(--sp-5);
      border-bottom: 1px solid var(--border);
    }

    .car-controls {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }

    .car-btn {
      width: 34px;
      height: 34px;
      border-radius: var(--r-pill);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--t-std) var(--ease);
      flex-shrink: 0;
      line-height: 1;
      box-shadow: var(--shadow-xs);
    }

    .car-btn:hover {
      border-color: var(--brand);
      color: var(--brand);
      background: var(--brand-subtle);
    }

    .car-viewport {
      overflow: hidden;
      border-radius: var(--r-sm);
    }

    .car-track {
      display: flex;
      gap: var(--sp-4);
      transition: transform .45s cubic-bezier(.25, .46, .45, .94);
      will-change: transform;
    }

    .car-track.notrans {
      transition: none;
    }

    /* ─ Carousel card ─────────────────────────────────────────── */
    .cc {
      flex: 0 0 195px;
      background: var(--surface);
      border-radius: var(--r-lg);
      overflow: hidden;
      cursor: pointer;
      transition: all var(--t-std) var(--ease);
      border: 1px solid var(--border-soft);
      box-shadow: var(--shadow-sm);
    }

    .cc:hover {
      box-shadow: var(--shadow-card-hover);
      transform: translateY(-5px);
      border-color: var(--gray-300);
    }

    .cc-cover {
      width: 100%;
      height: 255px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.2rem;
      overflow: hidden;
      position: relative;
    }

    .cc-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s var(--ease);
    }

    .cc:hover .cc-cover img {
      transform: scale(1.04);
    }

    /* Discount badge */
    .cc-disc {
      position: absolute;
      top: var(--sp-2);
      left: var(--sp-2);
      background: var(--red);
      color: #fff;
      font-family: var(--font-sans);
      font-size: .62rem;
      font-weight: 700;
      padding: .15rem .4rem;
      border-radius: var(--r-pill);
      z-index: 2;
      letter-spacing: .02em;
    }

    .cc-info {
      padding: var(--sp-3) var(--sp-4) var(--sp-4);
    }

    /* Thin separator between cover and text */
    .cc-info::before {
      content: '';
      display: block;
      height: 1px;
      background: var(--border);
      margin-bottom: var(--sp-3);
    }

    .cc-title {
      font-family: var(--font-bn);
      font-size: .8125rem;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: var(--sp-1);
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .cc-author {
      font-size: .6875rem;
      color: var(--text-muted);
      margin-bottom: var(--sp-3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cc-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cc-stars {
      color: var(--amber);
      font-size: .6875rem;
    }

    .cc-price {
      font-family: var(--font-sans);
      font-size: .8rem;
      font-weight: 700;
      color: var(--brand-text);
    }

    .cc-price s {
      color: var(--text-muted);
      font-weight: 400;
      font-size: .67rem;
      margin-left: 3px;
    }

    /* ─ Dots ─────────────────────────────────────────────────── */
    .car-dots {
      display: flex;
      justify-content: center;
      gap: var(--sp-2);
      margin-top: var(--sp-4);
    }

    .cdot {
      width: 6px;
      height: 6px;
      border-radius: var(--r-pill);
      background: var(--gray-300);
      cursor: pointer;
      border: none;
      padding: 0;
      transition: all var(--t-std) var(--ease);
    }

    .cdot.on {
      background: var(--brand);
      width: 20px;
      border-radius: 3px;
    }

    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 12. BOOK GRID ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ═══════════════════════════════════════════════════════════════════ */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 185px));
      gap: var(--sp-5);
      align-items: start;
    }

    /* ─ Grid card ─────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-lg);
      overflow: hidden;
      cursor: pointer;
      transition: all var(--t-std) var(--ease);
      box-shadow: var(--shadow-sm);
    }

    .card:hover {
      box-shadow: var(--shadow-card-hover);
      transform: translateY(-4px);
      border-color: var(--gray-300);
    }

    .c-cover {
      width: 100%;
      aspect-ratio: 3/4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      overflow: hidden;
      position: relative;
    }

    .c-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s var(--ease);
    }

    .card:hover .c-cover img {
      transform: scale(1.04);
    }

    .c-disc {
      position: absolute;
      top: .4rem;
      left: .4rem;
      background: var(--red);
      color: #fff;
      font-family: var(--font-sans);
      font-size: .62rem;
      font-weight: 700;
      padding: .15rem .38rem;
      border-radius: var(--r-pill);
      z-index: 2;
      letter-spacing: .02em;
    }

    .c-info {
      padding: var(--sp-3) var(--sp-4) var(--sp-4);
    }

    .c-title {
      font-family: var(--font-bn);
      font-size: .8125rem;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: .25rem;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .c-author {
      font-size: .6875rem;
      color: var(--text-muted);
      margin-bottom: var(--sp-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .c-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .c-stars {
      color: var(--amber);
      font-size: .6875rem;
    }

    .c-cnt {
      font-size: .65rem;
      color: var(--text-muted);
    }

    .c-price {
      margin-top: var(--sp-2);
      font-family: var(--font-sans);
      font-size: .78rem;
      font-weight: 700;
      color: var(--brand-text);
    }

    .c-price s {
      color: var(--text-muted);
      font-weight: 400;
      font-size: .67rem;
      margin-left: 3px;
    }

    /* ─ Browse header ─────────────────────────────────────────── */
    .browse-hd {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      margin-bottom: var(--sp-6);
      flex-wrap: wrap;
    }

    .back-btn {
      padding: .375rem var(--sp-4);
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: .8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--t-fast) var(--ease);
      font-family: inherit;
      box-shadow: var(--shadow-xs);
    }

    .back-btn:hover {
      border-color: var(--brand);
      color: var(--brand);
      background: var(--brand-subtle);
    }

    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 13. SKELETON LOADING ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ═══════════════════════════════════════════════════════════════════ */
    @keyframes shimmer {
      0% {
        background-position: -400px 0;
      }

      100% {
        background-position: 400px 0;
      }
    }

    .sk {
      background: linear-gradient(90deg, var(--gray-200) 0%, var(--gray-100) 50%, var(--gray-200) 100%);
      background-size: 800px 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--r-sm);
    }

    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 14. BOOK MODAL ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ═══════════════════════════════════════════════════════════════════ */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .6);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: var(--sp-6);
    }

    .overlay.open {
      display: flex;
      animation: popIn var(--t-slow) var(--ease-out);
    }

    .modal {
      background: var(--surface);
      border-radius: var(--r-xl);
      max-width: 680px;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--border);
      /* Top accent line */
      border-top: 3px solid var(--brand);
    }

    .m-head {
      display: flex;
      gap: var(--sp-6);
      padding: var(--sp-6) var(--sp-6) var(--sp-5);
      border-bottom: 1px solid var(--border);
    }

    .m-cover {
      width: 108px;
      flex-shrink: 0;
      aspect-ratio: 2/3;
      border-radius: var(--r-md);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    .m-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .m-meta {
      flex: 1;
      min-width: 0;
    }

    .m-title {
      font-family: var(--font-sans);
      font-size: 1.1875rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: var(--sp-2);
      color: var(--text-primary);
      letter-spacing: -.02em;
    }

    .m-author {
      color: var(--text-secondary);
      font-size: .875rem;
      margin-bottom: var(--sp-4);
    }

    .m-price-wrap {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      background: var(--brand-subtle);
      border: 1px solid var(--brand-muted);
      border-radius: var(--r-sm);
      padding: .3125rem .625rem;
      margin-bottom: var(--sp-4);
    }

    .m-offer {
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 700;
      color: var(--brand-text);
    }

    .m-orig {
      font-size: .75rem;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .m-stats {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-5);
      margin-bottom: var(--sp-4);
    }

    .stat label {
      font-family: var(--font-sans);
      font-size: .65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      display: block;
      margin-bottom: 2px;
      font-weight: 600;
    }

    .stat span {
      font-family: var(--font-sans);
      font-size: .875rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .m-roko {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      padding: .4375rem .875rem;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: var(--r-pill);
      font-family: var(--font-sans);
      font-size: .8125rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background var(--t-fast) var(--ease);
    }

    .m-roko:hover {
      background: var(--brand-h);
    }

    .m-body {
      padding: var(--sp-5) var(--sp-6) var(--sp-6);
    }

    .m-desc {
      font-size: .875rem;
      line-height: 1.75;
      color: var(--text-secondary);
      margin-bottom: var(--sp-6);
      max-height: 140px;
      overflow-y: auto;
    }

    .rate-sec h3 {
      font-family: var(--font-sans);
      font-size: .95rem;
      font-weight: 700;
      margin-bottom: var(--sp-4);
      color: var(--text-primary);
      letter-spacing: -.01em;
    }

    .star-row {
      display: flex;
      gap: var(--sp-2);
      margin-bottom: var(--sp-4);
    }

    .star {
      font-size: 1.875rem;
      cursor: pointer;
      color: var(--gray-300);
      background: none;
      border: none;
      padding: 0;
      line-height: 1;
      transition: all var(--t-fast) var(--ease);
    }

    .star.lit,
    .star:hover {
      color: var(--amber);
      transform: scale(1.1);
    }

    .review-ta {
      width: 100%;
      padding: .6875rem var(--sp-3);
      border: 1.5px solid var(--border);
      border-radius: var(--r-md);
      font-size: .875rem;
      resize: vertical;
      min-height: 76px;
      outline: none;
      background: var(--gray-50);
      margin-bottom: var(--sp-4);
      transition: all var(--t-std) var(--ease);
      font-family: inherit;
      color: var(--text-primary);
    }

    .review-ta::placeholder {
      color: var(--text-muted);
    }

    .review-ta:focus {
      border-color: var(--brand);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, .10);
    }

    .m-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--sp-3);
    }

    .btn-cancel {
      padding: .4375rem var(--sp-5);
      border: 1.5px solid var(--border);
      border-radius: var(--r-pill);
      background: transparent;
      font-family: var(--font-sans);
      font-size: .875rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all var(--t-fast);
    }

    .btn-cancel:hover {
      border-color: var(--gray-400);
      color: var(--text-primary);
    }

    .btn-submit {
      padding: .5rem var(--sp-6);
      background: var(--brand);
      border: none;
      border-radius: var(--r-pill);
      font-family: var(--font-sans);
      font-size: .875rem;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      transition: all var(--t-std) var(--ease);
      box-shadow: 0 2px 8px rgba(13, 148, 136, .3);
    }

    .btn-submit:hover {
      background: var(--brand-h);
      box-shadow: 0 4px 14px rgba(13, 148, 136, .4);
      transform: translateY(-1px);
    }

    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 15. PROFILE DRAWER ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ═══════════════════════════════════════════════════════════════════ */
    .prof-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .5);
      z-index: 2000;
      display: none;
      justify-content: flex-end;
      backdrop-filter: blur(4px);
    }

    .prof-overlay.open {
      display: flex;
    }

    .prof-drawer {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      height: 100%;
      overflow-y: auto;
      box-shadow: -8px 0 40px rgba(0, 0, 0, .14);
      animation: slideIn var(--t-slow) var(--ease-out);
      border-left: 1px solid var(--border);
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
      }

      to {
        transform: none;
      }
    }

    /* Drawer header — keep neutral dark */
    .pd-hd {
      background: var(--gray-900);
      padding: var(--sp-8) var(--sp-6) var(--sp-6);
      position: relative;
    }

    .pd-close {
      position: absolute;
      top: var(--sp-4);
      right: var(--sp-4);
      width: 28px;
      height: 28px;
      border-radius: var(--r-pill);
      border: 1px solid rgba(255, 255, 255, .2);
      background: transparent;
      color: rgba(255, 255, 255, .7);
      font-size: .9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--t-fast);
      line-height: 1;
    }

    .pd-close:hover {
      background: rgba(255, 255, 255, .12);
      color: #fff;
    }

    .pd-av {
      width: 52px;
      height: 52px;
      border-radius: var(--r-pill);
      background: var(--amber);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      font-size: 1.375rem;
      font-weight: 800;
      color: var(--gray-900);
      margin-bottom: var(--sp-4);
      border: 2px solid rgba(255, 255, 255, .2);
    }

    .pd-name {
      font-family: var(--font-sans);
      font-size: 1.125rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -.02em;
    }

    .pd-sub {
      font-size: .78rem;
      color: rgba(255, 255, 255, .45);
      margin-top: var(--sp-1);
    }

    /* Stats row */
    .pd-stats {
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .pd-stat {
      flex: 1;
      padding: var(--sp-4) var(--sp-2);
      text-align: center;
      border-right: 1px solid var(--border);
    }

    .pd-stat:last-child {
      border-right: none;
    }

    .pd-stat-v {
      font-family: var(--font-sans);
      font-size: 1.375rem;
      font-weight: 700;
      color: var(--brand);
      line-height: 1;
      letter-spacing: -.03em;
    }

    .pd-stat-l {
      font-family: var(--font-sans);
      font-size: .66rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    /* Tabs */
    .pd-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding: 0 var(--sp-4);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .pd-tab {
      padding: .6875rem var(--sp-4);
      border: none;
      background: transparent;
      font-size: .8125rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all var(--t-fast) var(--ease);
      white-space: nowrap;
      font-family: inherit;
    }

    .pd-tab:hover {
      color: var(--text-primary);
    }

    .pd-tab.on {
      color: var(--brand);
      border-bottom-color: var(--brand);
      font-weight: 700;
    }

    .pd-panel {
      display: none;
      padding: var(--sp-5) var(--sp-5);
    }

    .pd-panel.on {
      display: block;
    }

    /* ─ Info cards ─────────────────────────────────────────────── */
    .a-card {
      border-radius: var(--r-md);
      padding: var(--sp-4);
      margin-bottom: var(--sp-3);
      border: 1px solid var(--border);
      background: var(--gray-50);
      border-left: 3px solid var(--brand);
    }

    .a-card.green {
      background: var(--green-bg);
      border-color: var(--green);
      border-left-color: var(--green);
    }

    .a-card.yellow {
      background: var(--amber-bg);
      border-color: var(--amber);
      border-left-color: var(--amber);
    }

    .a-lbl {
      font-family: var(--font-sans);
      font-size: .67rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--brand);
      margin-bottom: var(--sp-2);
    }

    .a-card.green .a-lbl {
      color: #065f46;
    }

    .a-card.yellow .a-lbl {
      color: #92400e;
    }

    .a-val {
      font-size: .84rem;
      color: var(--text-secondary);
      line-height: 1.65;
    }

    .a-chip {
      display: inline-flex;
      align-items: center;
      gap: .28rem;
      padding: .2rem .6rem;
      border-radius: var(--r-pill);
      font-size: .72rem;
      font-weight: 700;
      margin-top: var(--sp-2);
    }

    /* ─ Category bars ─────────────────────────────────────────── */
    .bar-row {
      margin-bottom: var(--sp-4);
    }

    .bar-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: var(--sp-2);
    }

    .bar-name {
      font-size: .8125rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .bar-meta {
      font-size: .6875rem;
      color: var(--text-muted);
    }

    .bar-bg {
      height: 5px;
      background: var(--gray-200);
      border-radius: var(--r-pill);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--brand);
      border-radius: var(--r-pill);
      transition: width .9s cubic-bezier(.25, .46, .45, .94);
      width: 0;
    }

    /* ─ History items ─────────────────────────────────────────── */
    .h-item {
      display: flex;
      gap: var(--sp-3);
      align-items: flex-start;
      padding: var(--sp-3) 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background var(--t-fast) var(--ease);
      border-radius: var(--r-sm);
    }

    .h-item:hover {
      background: var(--gray-50);
      padding: var(--sp-3) var(--sp-3);
      margin: 0 calc(-1 * var(--sp-3));
    }

    .h-item:last-child {
      border-bottom: none;
    }

    .h-thumb {
      width: 38px;
      flex-shrink: 0;
      aspect-ratio: 2/3;
      border-radius: var(--r-sm);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .h-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .h-info {
      flex: 1;
      min-width: 0;
    }

    .h-title {
      font-size: .8125rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--font-bn);
    }

    .h-author {
      font-size: .6875rem;
      color: var(--text-muted);
      margin-bottom: var(--sp-2);
    }

    .h-meta {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      flex-wrap: wrap;
    }

    .h-badge {
      font-family: var(--font-sans);
      font-size: .66rem;
      background: var(--gray-100);
      padding: 1px var(--sp-2);
      border-radius: var(--r-sm);
      color: var(--text-muted);
      font-weight: 600;
      border: 1px solid var(--border);
    }

    .h-stars {
      color: var(--amber);
      font-size: .72rem;
      font-weight: 700;
    }

    .h-date {
      font-family: var(--font-sans);
      font-size: .63rem;
      color: var(--text-muted);
    }

    .h-review {
      margin-top: var(--sp-2);
      font-size: .76rem;
      color: var(--text-secondary);
      background: var(--gray-50);
      border-radius: var(--r-sm);
      padding: var(--sp-2) var(--sp-3);
      border-left: 2px solid var(--gray-300);
      font-style: italic;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.5;
    }

    .pd-empty {
      text-align: center;
      padding: var(--sp-12) var(--sp-6);
      color: var(--text-muted);
    }

    .pd-empty .ei {
      font-size: 2.25rem;
      margin-bottom: var(--sp-3);
      opacity: .5;
    }

    .pd-empty p {
      font-size: .8125rem;
    }

    /* Activity grid */
    .act-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-3);
      margin-top: var(--sp-2);
    }

    .act-cell {
      background: var(--surface);
      border-radius: var(--r-md);
      padding: var(--sp-4);
      border: 1px solid var(--border);
      text-align: center;
    }

    .act-num {
      font-family: var(--font-sans);
      font-size: 1.625rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1;
      letter-spacing: -.03em;
    }

    .act-lbl {
      font-size: .6875rem;
      color: var(--text-muted);
      margin-top: var(--sp-1);
      font-weight: 500;
    }

    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 16. WELCOME BOX ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ═══════════════════════════════════════════════════════════════════ */
    .welcome-box {
      /* Dark but understated — no rainbow gradient */
      background: var(--gray-900);
      border-radius: var(--r-xl);
      padding: var(--sp-12) var(--sp-8) var(--sp-10);
      text-align: center;
      margin-bottom: var(--sp-8);
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--gray-800);
      position: relative;
      overflow: hidden;
    }

    /* Minimal ambient glow */
    .welcome-box::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(13, 148, 136, .12) 0%, transparent 60%);
      pointer-events: none;
    }

    .welcome-icon {
      font-size: 3rem;
      margin-bottom: var(--sp-4);
      display: block;
      position: relative;
      z-index: 1;
    }

    .welcome-title {
      font-family: var(--font-sans);
      font-size: 1.625rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: var(--sp-3);
      letter-spacing: -.03em;
      position: relative;
      z-index: 1;
    }

    .welcome-sub {
      font-size: .9rem;
      color: rgba(255, 255, 255, .55);
      max-width: 440px;
      margin: 0 auto var(--sp-8);
      line-height: 1.7;
      position: relative;
      z-index: 1;
    }

    .welcome-steps {
      display: flex;
      gap: var(--sp-4);
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: var(--sp-5);
      position: relative;
      z-index: 1;
    }

    .w-step {
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: var(--r-lg);
      padding: var(--sp-4) var(--sp-5);
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      min-width: 160px;
      transition: background var(--t-std) var(--ease);
    }

    .w-step:hover {
      background: rgba(255, 255, 255, .10);
    }

    .w-step-icon {
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .w-step-txt {
      text-align: left;
    }

    .w-step-num {
      font-family: var(--font-sans);
      font-size: .63rem;
      font-weight: 700;
      color: rgba(255, 255, 255, .35);
      text-transform: uppercase;
      letter-spacing: .08em;
      display: block;
    }

    .w-step-lbl {
      font-family: var(--font-sans);
      font-size: .84rem;
      font-weight: 600;
      color: rgba(255, 255, 255, .9);
    }

    .welcome-hint {
      font-size: .78rem;
      color: rgba(255, 255, 255, .3);
      position: relative;
      z-index: 1;
    }

    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 17. TOAST ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ═══════════════════════════════════════════════════════════════════ */
    .toast {
      position: fixed;
      bottom: var(--sp-8);
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--gray-900);
      color: #fff;
      padding: .625rem var(--sp-6);
      border-radius: var(--r-pill);
      font-family: var(--font-sans);
      font-size: .84rem;
      font-weight: 500;
      z-index: 9999;
      opacity: 0;
      transition: all var(--t-slow) var(--ease-out);
      pointer-events: none;
      box-shadow: var(--shadow-xl);
      max-width: 90vw;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .08);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.ok {
      background: #065f46;
    }

    .toast.err {
      background: var(--red);
    }

    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 18. EMPTY STATES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ═══════════════════════════════════════════════════════════════════ */
    .empty {
      text-align: center;
      padding: var(--sp-16) var(--sp-6);
      color: var(--text-muted);
      grid-column: 1/-1;
    }

    .empty .ei {
      font-size: 2.5rem;
      margin-bottom: var(--sp-4);
      opacity: .4;
      display: block;
    }

    .empty h3 {
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: var(--sp-2);
    }

    .empty p {
      font-size: .8125rem;
    }

    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 19. GENERATED COVERS (JS-rendered) ━━━━━━━━━━━━━━━━━━━━━━
   ═══════════════════════════════════════════════════════════════════ */
    .gen-cover {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--sp-3);
      position: relative;
      overflow: hidden;
    }

    .gen-cover-title {
      font-size: .7rem;
      font-weight: 700;
      color: #fff;
      text-align: center;
      line-height: 1.3;
      z-index: 1;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .4);
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .gen-cover-deco {
      position: absolute;
      border-radius: 50%;
      opacity: .25;
    }

    /* ═══════════════════════════════════════════════════════════════════
   ━━━ § 20. SCROLLBAR ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ═══════════════════════════════════════════════════════════════════ */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--gray-300);
      border-radius: var(--r-pill);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--gray-400);
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    /* ═══════════════════════════════════════════════════════════════════

    /* ─── CAROUSEL ───────────────────────────────────────────────────────────────── */
    function visCount() { var w = window.innerWidth; return w < 480 ? 2 : w < 700 ? 3 : w < 960 ? 4 : w < 1200 ? 5 : 6; }
    function buildCarousel() {
      var controls = document.querySelector('.car-controls');
      if (!carBooks.length) { if (controls) controls.style.visibility = 'hidden'; document.getElementById('car-dots').innerHTML = ''; return; }
      if (controls) controls.style.visibility = 'visible';

      var clones = carBooks.slice(0, carVis); var all = carBooks.concat(clones);
      document.getElementById('car-track').innerHTML = all.map(makeCarCard).join('');

      var vp = document.querySelector('.car-viewport');
      vp.onmouseenter = function () { carPaused = true; }; vp.onmouseleave = function () { carPaused = false; };
      var tx = null;

      var t = document.getElementById('car-track');
      if (!anim) t.classList.add('notrans'); else t.classList.remove('notrans');
      t.style.transform = 'translateX(-' + (carIdx * (195 + 16)) + 'px)';
      updateDots(carIdx % carBooks.length);
      if (!anim) { t.offsetHeight; t.classList.remove('notrans'); }
    }
    function carMove(dir) { carIdx += dir; carApply(true); setTimeout(function () { if (carIdx >= carBooks.length) { carIdx = 0; carApply(false); } if (carIdx < 0) { carIdx = carBooks.length - 1; carApply(false); } }, 460); }
    function buildDots() { document.getElementById('car-dots').innerHTML = carBooks.map(function (_, i) { return '<button class="cdot' + (i === 0 ? ' on' : '') + '" data-i="' + i + '"></button>'; }).join(''); document.querySelectorAll('.cdot').forEach(function (btn) { btn.addEventListener('click', function () { carIdx = parseInt(this.dataset.i); carApply(true); clearInterval(carTimer); carTimer = setInterval(function () { if (!carPaused) carMove(1); }, 3500); }); }); }
    function updateDots(idx) { document.querySelectorAll('.cdot').forEach(function (b, i) { b.className = 'cdot' + (i === idx ? ' on' : ''); }); }
    window.addEventListener('resize', function () { if (carBooks.length) { carVis = visCount(); carIdx = 0; carApply(false); } });

    /* ─── CARD BUILDERS ──────────────────────────────────────────────────────────── */
    function makeCarCard(b) {
      var r = b.avg_rating || 0, st = ''; for (var i = 1; i <= 5; i++)st += i <= Math.round(r) ? '★' : '☆';
      var cov = coverHTML(b, 255); var disc = '';
      if (b.offer_price && b.price && b.price > b.offer_price) { var p = Math.round((1 - b.offer_price / b.price) * 100); if (p > 0) disc = '<div class="cc-disc">-' + p + '%</div>'; }
      var price = '';
      if (b.offer_price) price = '<span class="cc-price">৳' + Math.round(b.offer_price) + (b.price && b.price > b.offer_price ? '<s>৳' + Math.round(b.price) + '</s>' : '') + '</span>';
      else if (b.price) price = '<span class="cc-price">৳' + Math.round(b.price) + '</span>';
      return '<div class="cc" data-bid="' + esc(b.book_id) + '">'
        + '<div class="cc-cover">' + cov + disc + '</div>'
        + '<div class="cc-info"><div class="cc-title">' + esc(b.title || '—') + '</div>'
        + '<div class="cc-author">' + esc(b.author || '—') + '</div>'
        + '<div class="cc-foot"><span class="cc-stars">' + st + ' <small style="color:var(--text-muted);font-size:.62rem">' + r.toFixed(1) + '</small></span>' + price + '</div>'
        + '</div></div>';
    }

    function makeGridCard(b) {
      var r = b.avg_rating || 0, st = ''; for (var i = 1; i <= 5; i++)st += i <= Math.round(r) ? '★' : '☆';
      var cnt = b.rating_count || 0, cs = cnt >= 1000000 ? (cnt / 1000000).toFixed(1) + 'M' : cnt >= 1000 ? Math.round(cnt / 1000) + 'K' : String(cnt);
      var cov = coverHTML(b, null); var disc = '';
      if (b.offer_price && b.price && b.price > b.offer_price) { var p = Math.round((1 - b.offer_price / b.price) * 100); if (p > 0) disc = '<div class="c-disc">-' + p + '%</div>'; }
      var price = '';
      if (b.offer_price) price = '<div class="c-price">৳' + Math.round(b.offer_price) + (b.price && b.price > b.offer_price ? '<s>৳' + Math.round(b.price) + '</s>' : '') + '</div>';
      else if (b.price) price = '<div class="c-price">৳' + Math.round(b.price) + '</div>';
      return '<div class="card" data-bid="' + esc(b.book_id) + '">'
        + '<div class="c-cover">' + cov + disc + '</div>'
        + '<div class="c-info"><div class="c-title">' + esc(b.title || '—') + '</div>'
        + '<div class="c-author">' + esc(b.author || '—') + '</div>'
        + '<div class="c-meta"><span class="c-stars">' + st + ' <small style="color:var(--text-muted);font-size:.63rem">' + r.toFixed(1) + '</small></span><span class="c-cnt">' + cs + '</span></div>'
        + price + '</div></div>';
    }

    function bindCards(gridId) { document.getElementById(gridId).querySelectorAll('.card').forEach(function (el) { el.addEventListener('click', function () { openBook(this.dataset.bid); }); }); }
    function skelGrid(n) { var s = ''; for (var i = 0; i < n; i++)s += '<div class="card"><div class="c-cover sk" style="aspect-ratio:3/4"></div><div class="sk" style="height:.72rem;margin:.6rem .75rem .25rem;border-radius:4px"></div><div class="sk" style="height:.62rem;width:55%;margin:.2rem .75rem;border-radius:4px"></div></div>'; return s; }

    /* ─── BOOK MODAL ─────────────────────────────────────────────────────────────── */
    function openBook(bookId) {
      curBook = bookId; curStar = 0; updateStars(0); document.getElementById('rev-ta').value = '';
      api('POST', '/books/' + bookId + '/click', null, function () { loadRecs(); pdLoaded = false; });
      api('GET', '/books/' + bookId, null, function (b, err) {
        if (err) { showToast(lang === 'bn' ? 'বই লোড হয়নি' : 'Could not load book', 'err'); return; }
        document.getElementById('m-title').textContent = b.title || '—';
        document.getElementById('m-author').textContent = (lang === 'bn' ? 'লেখক: ' : 'Author: ') + (b.author || 'Unknown');
        document.getElementById('m-desc').textContent = b.description || (lang === 'bn' ? 'বিবরণ নেই।' : 'No description.');
        var cv = document.getElementById('m-cover'); cv.innerHTML = coverHTML(b, null); cv.style.background = 'transparent';
        var pw = document.getElementById('m-price');
        if (b.offer_price || b.price) { var sp = b.offer_price ? Math.round(b.offer_price) : Math.round(b.price); pw.innerHTML = '<div class="m-price-wrap"><span class="m-offer">৳' + sp + '</span>' + (b.offer_price && b.price && b.price > b.offer_price ? '<span class="m-orig">৳' + Math.round(b.price) + '</span>' : '') + '</div>'; } else pw.innerHTML = '';
        var rl = document.getElementById('m-link'); rl.innerHTML = b.book_url ? '<a class="m-roko" href="' + esc(b.book_url) + '" target="_blank">🛒 ' + (lang === 'bn' ? 'রকমারিতে দেখুন' : 'View on Rokomari') + '</a>' : '';
        var rt = lang === 'bn' ? 'রেটিং' : 'Rating', rv = lang === 'bn' ? 'রিভিউ' : 'Reviews', pg = lang === 'bn' ? 'পাতা' : 'Pages', yr = lang === 'bn' ? 'সাল' : 'Year';
        document.getElementById('m-stats').innerHTML = '<div class="stat"><label>' + rt + '</label><span>⭐ ' + (b.avg_rating || 0).toFixed(1) + '/5</span></div><div class="stat"><label>' + rv + '</label><span>' + (b.rating_count || 0) + '</span></div>' + (b.pages ? '<div class="stat"><label>' + pg + '</label><span>' + b.pages + '</span></div>' : '') + (b.publication_year ? '<div class="stat"><label>' + yr + '</label><span>' + b.publication_year + '</span></div>' : '');
        document.getElementById('overlay').className = 'overlay open'; document.body.style.overflow = 'hidden';
      });
    }
    function closeModal() { document.getElementById('overlay').className = 'overlay'; document.body.style.overflow = ''; curBook = null; }
    function setStar(n) { curStar = n; updateStars(n); }
    function updateStars(n) { document.querySelectorAll('.star').forEach(function (s, i) { s.className = 'star' + (i < n ? ' lit' : ''); }); }
    function submitRating() {
      if (!curBook) return; if (!curStar) { showToast(lang === 'bn' ? 'স্টার রেটিং দিন' : 'Select a star rating', 'err'); return; }
      var rev = document.getElementById('rev-ta').value.trim();
      api('POST', '/books/rate', { book_id: curBook, rating: curStar, review: rev || null }, function (d, err) {
        if (err) { showToast(err, 'err'); return; }
        showToast(lang === 'bn' ? 'রেটিং সেভ হয়েছে! সাজেশন আপডেট হচ্ছে…' : 'Rating saved! Updating picks…', 'ok');
        closeModal(); loadRecs(); pdLoaded = false;
      });
    }

    /* ─── PROFILE DRAWER ─────────────────────────────────────────────────────────── */
    function openProfile() { document.getElementById('prof-overlay').classList.add('open'); document.body.style.overflow = 'hidden'; document.getElementById('pd-av').textContent = (username || 'U')[0].toUpperCase(); if (!pdLoaded) fetchDashboard(); }
    function closeProfile() { document.getElementById('prof-overlay').classList.remove('open'); document.body.style.overflow = ''; }
    function pdTab(name) { ['dash', 'ratings', 'history'].forEach(function (t) { document.getElementById('pdp-' + t).className = 'pd-panel' + (t === name ? ' on' : ''); document.getElementById('pdt-' + t).className = 'pd-tab' + (t === name ? ' on' : ''); }); }
    function fetchDashboard() {
      ['pd-dash-content', 'pd-ratings-content', 'pd-history-content'].forEach(function (id) { document.getElementById(id).innerHTML = '<div class="pd-empty"><div class="ei">⏳</div><p>' + (lang === 'bn' ? 'লোড হচ্ছে…' : 'Loading…') + '</p></div>'; });
      api('GET', '/me/dashboard', null, function (data, err) { if (err) { document.getElementById('pd-dash-content').innerHTML = '<div class="pd-empty"><div class="ei">⚠️</div><p>' + esc(err) + '</p></div>'; return; } pdLoaded = true; fillPDHeader(data); fillPDDash(data); fillPDRatings(data); fillPDHistory(data); });
    }
    function fillPDHeader(d) { var s = d.stats || {}; document.getElementById('pd-name').textContent = d.username || username || 'User'; document.getElementById('pd-sub').textContent = lang === 'bn' ? 'RecBook সদস্য' : 'RecBook member'; document.getElementById('ps-clicks').textContent = s.total_clicks || 0; document.getElementById('ps-rates').textContent = s.total_ratings || 0; document.getElementById('ps-avg').textContent = s.avg_rating_given ? '⭐' + s.avg_rating_given : '—'; }
    function fillPDDash(d) {
      var ex = d.rec_explanation || {}, cats = d.category_preferences || [], s = d.stats || {}; var isCold = !!ex.is_cold_start; var html = '';
      html += '<div class="a-card"><div class="a-lbl">' + (lang === 'bn' ? 'অ্যালগরিদম' : 'Algorithm') + '</div><div class="a-val"><strong>' + (ex.algorithm || 'Category-Aware Popularity') + '</strong></div><div>' + (isCold ? '<span class="a-chip sbadge cold">🌱 Cold Start</span>' : '<span class="a-chip sbadge warm">✨ ' + (lang === 'bn' ? 'ব্যক্তিগত মোড' : 'Personalized') + '</span>') + '</div></div>';
      html += '<div class="a-card green"><div class="a-lbl">' + (lang === 'bn' ? 'কিভাবে কাজ করে' : 'How It Works') + '</div><div class="a-val">' + esc(ex.how_it_works || '') + '</div></div>';
      html += '<div class="a-card yellow"><div class="a-lbl">' + (lang === 'bn' ? 'আপনার অ্যাক্টিভিটি' : 'Your Activity') + '</div><div class="act-grid"><div class="act-cell"><div class="act-num">' + (s.total_clicks || 0) + '</div><div class="act-lbl">' + (lang === 'bn' ? 'বই দেখেছেন' : 'Books viewed') + '</div></div><div class="act-cell"><div class="act-num">' + (s.total_ratings || 0) + '</div><div class="act-lbl">' + (lang === 'bn' ? 'রেটিং দিয়েছেন' : 'Ratings given') + '</div></div></div></div>';
      if (cats.length) { html += '<div style="margin-top:1.25rem"><div style="font-size:.67rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-muted);margin-bottom:.75rem">' + (lang === 'bn' ? 'বিভাগ পছন্দ (রেকমেন্ডেশনের ভিত্তি)' : 'Category Preferences') + '</div>'; cats.forEach(function (c) { html += '<div class="bar-row"><div class="bar-top"><span class="bar-name">' + esc(c.name) + '</span><span class="bar-meta">' + c.pct + '% · ' + c.books_available + ' ' + (lang === 'bn' ? 'বই' : 'books') + '</span></div><div class="bar-bg"><div class="bar-fill" style="width:' + c.pct + '%"></div></div></div>'; }); html += '</div>'; }
      else { html += '<div class="pd-empty"><div class="ei">📂</div><p>' + (lang === 'bn' ? 'বিভাগ পছন্দ নেই এখনো। বই দেখুন ও রেট করুন!' : 'No preferences yet. Browse and rate books!') + '</p></div>'; }
      document.getElementById('pd-dash-content').innerHTML = html;
    }
    function fillPDRatings(d) {
      var books = d.rated_books || [];
      if (!books.length) { document.getElementById('pd-ratings-content').innerHTML = '<div class="pd-empty"><div class="ei">⭐</div><p>' + (lang === 'bn' ? 'এখনো কোনো রেটিং নেই' : 'No ratings yet') + '</p></div>'; return; }
      var html = ''; books.forEach(function (b) { var st = ''; for (var i = 1; i <= 5; i++)st += i <= (b.rating || 0) ? '★' : '☆'; var isDefault = !b.cover_url || b.cover_url.indexOf('default_book_cover') !== -1; var th = isDefault ? genCoverHTML(b.title, b.book_id, null).replace('height:100%', 'height:100%;width:100%') : '<img src="' + esc(b.cover_url) + '" loading="lazy" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display=\'none\'">'; html += '<div class="h-item" data-bid="' + esc(b.book_id) + '"><div class="h-thumb" style="background:transparent">' + th + '</div><div class="h-info"><div class="h-title">' + esc(b.title || '—') + '</div><div class="h-author">' + esc(b.author || '—') + '</div><div class="h-meta"><span class="h-stars">' + st + ' ' + b.rating + '/5</span>' + (b.created_at ? '<span class="h-date">' + fmtDate(b.created_at) + '</span>' : '') + '</div>' + (b.review ? '<div class="h-review">&ldquo;' + esc(b.review) + '&rdquo;</div>' : '') + '</div></div>'; });
      var el = document.getElementById('pd-ratings-content'); el.innerHTML = html; el.querySelectorAll('.h-item').forEach(function (row) { row.addEventListener('click', function () { closeProfile(); openBook(this.dataset.bid); }); });
    }
    function fillPDHistory(d) {
      var items = d.recent_clicks || [];
      if (!items.length) { document.getElementById('pd-history-content').innerHTML = '<div class="pd-empty"><div class="ei">📖</div><p>' + (lang === 'bn' ? 'ইতিহাস নেই' : 'No history yet') + '</p></div>'; return; }
      var html = ''; items.forEach(function (b) { var isDefault = !b.cover_url || b.cover_url.indexOf('default_book_cover') !== -1; var th = isDefault ? genCoverHTML(b.title, b.book_id, null).replace('height:100%', 'height:100%;width:100%') : '<img src="' + esc(b.cover_url) + '" loading="lazy" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display=\'none\'">'; html += '<div class="h-item" data-bid="' + esc(b.book_id) + '"><div class="h-thumb" style="background:transparent">' + th + '</div><div class="h-info"><div class="h-title">' + esc(b.title || '—') + '</div><div class="h-author">' + esc(b.author || '—') + '</div><div class="h-meta"><span class="h-badge">' + (lang === 'bn' ? 'দেখেছেন' : 'Viewed') + '</span>' + (b.created_at ? '<span class="h-date">' + fmtDate(b.created_at) + '</span>' : '') + '</div></div></div>'; });
      var el = document.getElementById('pd-history-content'); el.innerHTML = html; el.querySelectorAll('.h-item').forEach(function (row) { row.addEventListener('click', function () { closeProfile(); openBook(this.dataset.bid); }); });
    }
    function fmtDate(s) { try { var d = new Date(s.replace(' ', 'T') + 'Z'); return d.toLocaleDateString(lang === 'bn' ? 'bn-BD' : 'en-GB', { day: 'numeric', month: 'short' }); } catch (e) { return s.slice(0, 10); } }

    /* ─── API ────────────────────────────────────────────────────────────────────── */
    function api(method, path, body, cb) { var xhr = new XMLHttpRequest(); xhr.open(method, API + path, true); xhr.setRequestHeader('Content-Type', 'application/json'); if (token) xhr.setRequestHeader('Authorization', 'Bearer ' + token); if (userId) xhr.setRequestHeader('X-User-ID', userId); xhr.onreadystatechange = function () { if (xhr.readyState !== 4) return; try { var d = JSON.parse(xhr.responseText); if (xhr.status >= 200 && xhr.status < 300) cb(d, null); else cb(null, d.detail || 'Error ' + xhr.status); } catch (e) { cb(null, lang === 'bn' ? 'নেটওয়ার্ক ত্রুটি' : 'Network error'); } }; xhr.onerror = function () { cb(null, lang === 'bn' ? 'সংযোগ ব্যর্থ' : 'Connection failed'); }; xhr.send(body ? JSON.stringify(body) : null); }
    function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function showToast(msg, type) { var t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast ' + (type || ''); t.classList.add('show'); setTimeout(function () { t.className = 'toast'; }, 3200); }

    /* ─── KEYBOARD ───────────────────────────────────────────────────────────────── */
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeModal(); closeProfile(); closeAllDD(); closeFilterPanel(); }
      if (e.key === 'Enter') { var as = document.getElementById('auth-screen'); if (as && as.style.display !== 'none') { if (document.getElementById('f-reg').style.display !== 'none') doReg(); else doLogin(); } }
    });

    init();
  </script>
